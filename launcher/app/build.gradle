plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    // TMDB API key for the home's weekly artwork (what's popular on each streaming service). Kept out of
    // git: put tmdb.key=<your key> in launcher/local.properties (free at themoviedb.org → Settings → API).
    def localProps = new Properties()
    def lp = rootProject.file('local.properties')
    if (lp.exists()) lp.withInputStream { localProps.load(it) }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField 'String', 'TMDB_KEY', '"' + (localProps.getProperty('tmdb.key') ?: '') + '"'
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
